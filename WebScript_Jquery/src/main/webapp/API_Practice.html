      $.each(API_LIST, function (label) {
        const yearMonth = label.substring(0, 4) + '년 ' + Number(label.substring(5, 7)) + '월';
        $('#apiDate').append('<option value="' + label + '">' + yearMonth + '</option>');
      });

      $('#btn').click(function () {
        $('#tableHead').empty();
        $('#tableBody').empty();
        $('#message').text('조회 중입니다...');

        const selectedDate = $('#apiDate').val();
        const apiUrl = API_LIST[selectedDate];
        const perPage = $('input[name="perPage"]:checked').val();

        const param = {
          page: 1,
          perPage: perPage,
          returnType: 'JSON',
          serviceKey: decodeURIComponent(SERVICE_KEY)
        };

        console.log(apiUrl, param);

        $.ajax({
          url: apiUrl,
          type: 'GET',
          data: param,
          dataType: 'json',
          success: function (jsondata) {
            const pensionList = jsondata.data || [];

            if (pensionList.length === 0) {
              $('#message').text('조회된 데이터가 없습니다. serviceKey를 확인하세요.');
              return;
            }

            makeTable(pensionList);
            $('#message').text('총 ' + jsondata.totalCount + '건 중 ' + jsondata.currentCount + '건 조회');
          },
          error: function (xhr) {
            console.log(xhr);
            $('#message').text('API 호출 실패: serviceKey 또는 네트워크/CORS 상태를 확인하세요.');
          }
        });
      });

      function makeTable(list) {
        const keys = Object.keys(list[0]).sort(function (a, b) {
          if (a === '구분') return -1;
          if (b === '구분') return 1;
          if (a.indexOf('현황') === 0) return 1;
          if (b.indexOf('현황') === 0) return -1;
          return a.localeCompare(b, 'ko', { numeric: true });
        });

        $('#tableHead').append('<tr></tr>');
        $.each(keys, function (index, key) {
          $('#tableHead tr').append('<th scope="col">' + key + '</th>');
        });

        $.each(list, function (index, obj) {
          let row = '<tr>';
          $.each(keys, function (i, key) {
            row += '<td>' + formatValue(key, obj[key]) + '</td>';
          });
          row += '</tr>';
          $('#tableBody').append(row);
        });
      }

      function formatValue(key, value) {
        if (value == null) {
          return '';
        }

        if (key.indexOf('십억') === -1 || isNaN(value)) {
          return value;
        }

        const billionWon = Number(value);
        const jo = Math.floor(billionWon / 1000);
        const eok = (billionWon % 1000) * 10;

        if (jo > 0 && eok > 0) {
          return jo.toLocaleString() + '조 ' + eok.toLocaleString() + '억';
        }

        if (jo > 0) {
          return jo.toLocaleString() + '조';
        }

        return eok.toLocaleString() + '억';
      }
