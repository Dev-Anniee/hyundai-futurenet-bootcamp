
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Document</title>

  <script>
    /*
        addClass() - Adds one or more classes to the selected elements
        removeClass() - Removes one or more classes from the selected elements
        toggleClass() - Toggles between adding/removing classes from the selected elements
        css() - Sets or returns the style attribute


        append() - Inserts content at the end of the selected elements
        prepend() - Inserts content at the beginning of the selected elements
        after() - Inserts content after the selected elements
        before() - Inserts content before the selected elements

        <p>A</p> >> B append()  >> <p>AB</p>  >> C append();  >> <p>ABC</p>
        <p>A</p> >> B prepend() >> <p>BA</p>  >> C prepend(); >><p>CBA</p>

        <p>A</p> >> B after()  >> <p>A</p>B
        <p>A</p> >> B before()  >> B<p>A</p>

        태그안쪽 : prepend() , append()
        태그 바깥쪽 : before() , after()

        remove() - Removes the selected element (and its child elements)  : 자기자신제거
        empty() - Removes the child elements from the selected element    : 자식제거

    */
    $(function(){  // $(document).ready(
      $('#btn1').click(function(){
        $('p').append('<b>append</b>');
      });

      $('#btn2').click(function(){
        $('ol').prepend('<li>prepend text</li>');
      });
    });

  </script>
</head>
<body>
<p>this is p</p>
<p>this is another p</p>

<ol>
  <li>List item 1</li>
  <li>List item 2</li>
  <li>List item 3</li>
</ol>

<button id="btn1">Append Text</button>
<button id="btn2">prepend list items</button>
</body>
</html>
