<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
        main { max-width: 420px; margin: 70px auto; padding: 0 20px; }
        .panel { background: white; border: 1px solid #d8dee9; border-radius: 8px; padding: 26px; }
        label { display: block; margin: 14px 0 6px; font-weight: 700; }
        input { width: 100%; height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px; box-sizing: border-box; }
        button, a { display: inline-block; margin-top: 18px; border: 1px solid #1f2937; border-radius: 6px; padding: 10px 14px; text-decoration: none; font-size: 14px; }
        button { background: #1f2937; color: white; cursor: pointer; }
        a { color: #1f2937; background: white; }
        .actions { display: flex; gap: 8px; align-items: center; }
        .error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; border-radius: 6px; padding: 10px; }
    </style>
</head>
<body>
<main>
    <section class="panel">
        <h2>로그인</h2>
        <p class="error" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</p>

        <form action="/loginPro" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="USERNAME 입력: kim, manager, admin" required>

            <label for="pw">비밀번호</label>
            <input type="password" id="pw" name="pw" placeholder="비밀번호를 입력하세요" required>

            <div class="actions">
                <button type="submit">로그인</button>
                <a href="/join">회원가입</a>
                <a href="/">메인</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
