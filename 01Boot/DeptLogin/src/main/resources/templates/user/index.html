<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
        header { background: #2563eb; color: white; padding: 18px 32px; }
        main { max-width: 860px; margin: 32px auto; padding: 0 20px; }
        .panel { background: white; border: 1px solid #d8dee9; border-radius: 8px; padding: 24px; }
        a { color: #1f2937; text-decoration: none; border: 1px solid #1f2937; border-radius: 6px; padding: 8px 12px; display: inline-block; }
    </style>
</head>
<body>
<header>
    <h2>USER 접근 페이지</h2>
</header>
<main>
    <section class="panel">
        <p>USER, MANAGER, ADMIN 권한 사용자가 접근할 수 있습니다.</p>
        <p>아이디: <strong sec:authentication="principal.username"></strong></p>
        <p>권한: <span sec:authentication="principal.authorities"></span></p>
        <a href="/">메인</a>
    </section>
</main>
</body>
</html>
