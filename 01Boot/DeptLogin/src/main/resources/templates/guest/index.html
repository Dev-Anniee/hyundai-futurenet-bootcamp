<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Guest</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
        header { background: #6b7280; color: white; padding: 18px 32px; }
        main { max-width: 860px; margin: 32px auto; padding: 0 20px; }
        .panel { background: white; border: 1px solid #d8dee9; border-radius: 8px; padding: 24px; }
        a { color: #1f2937; text-decoration: none; border: 1px solid #1f2937; border-radius: 6px; padding: 8px 12px; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
<header>
    <h2>익명 사용자 접근 페이지</h2>
</header>
<main>
    <section class="panel">
        <p>로그인하지 않은 사용자도 접근할 수 있습니다.</p>
        <a href="/">메인</a>
        <a href="/login" sec:authorize="isAnonymous()">로그인</a>
    </section>
</main>
</body>
</html>
