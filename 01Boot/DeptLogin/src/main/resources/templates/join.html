<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
        main { max-width: 460px; margin: 50px auto; padding: 0 20px; }
        .panel { background: white; border: 1px solid #d8dee9; border-radius: 8px; padding: 26px; }
        label { display: block; margin: 14px 0 6px; font-weight: 700; }
        input { width: 100%; height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px; box-sizing: border-box; }
        button, a { display: inline-block; margin-top: 18px; border: 1px solid #1f2937; border-radius: 6px; padding: 10px 14px; text-decoration: none; font-size: 14px; }
        button { background: #1f2937; color: white; cursor: pointer; }
        a { color: #1f2937; background: white; }
        .help { color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<main>
    <section class="panel">
        <h2>회원가입</h2>
        <p class="help">가입한 회원은 기본적으로 ROLE_USER 권한을 받습니다.</p>

        <form action="/join" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required>

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>

            <label for="email">이메일</label>
            <input type="email" id="email" name="email">

            <label for="deptno">부서번호</label>
            <input type="number" id="deptno" name="deptno" placeholder="10, 20, 30, 40">

            <button type="submit">가입</button>
            <a href="/login">로그인</a>
            <a href="/">메인</a>
        </form>
    </section>
</main>
</body>
</html>
