<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>
</head>
<body>
  <button id="myBtn">클릭</button>
</body>
<script>
  let x = document.getElementById("myBtn");
  x.addEventListener("mouseover", myFunction);
  x.addEventListener("mouseout", myFunction);
  x.addEventListener("click", myFunction);

  function myFunction() {
    document.getElementById("myBtn").innerHTML +="MOUSE OVER<br>";
    document.getElementById("myBtn").innerHTML +="MOUSE OUT<br>";
    document.getElementById("myBtn").innerHTML +="MOUSE CLICK<br>";
  }
</script>
</html>
