<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    /*
      //https://naver.me/xVRRM0ka

      javaScript : 사건이 발생 (click , mouseover , mouseout) 내부적으로
      Event 대한 정보를 담고 있는 객체 자동 생성

      Event 객체 : 사건의 진실 (발생 , 주체 , 영향 , 정보) 생성된 객체를 통해서

      window.evnet 객체  메서드 , 속성 가지고 있다


      java 예외처리 비교
      try{
           0/0  예외가 발생 > 예외가 맞는 객체가 자동 생성 > new 예외객체 생성
      }catch(Exception e){

      }


      event 객체 + this + Array
    */
    window.onload = function(){

      let btn = document.getElementById("mybtn");

      //click 발생하면 자동 event 객체 생성 ...
      btn.onclick = function(e){  //e 변수를 통해서 Event 객체를 전달 받는다
        console.log(e.type); //이벤트 종류 파악
        console.log(e.target); //<span>눌러봐</span> 이벤트가 발생한 바로 그 요소를 ...
        console.log(e.currentTarget);//이벤트(리스너) 를 가지고 있는 요소  <button id="mybtn"><span>눌러봐</span></button>
        console.log(e.x);
        console.log(e.y);
      }

      let btn2 = document.getElementById("mybtn2");
      let handler = function(event){
        switch(event.type){
          case "click" : alert("클릭");
            break;
          case "mouseover": event.target.style.backgroundColor="red";
            break;
          case "mouseout": event.target.style.backgroundColor="";
            break;
        }
      }

      btn2.onclick=handler;
      btn2.onmouseover=handler;
      btn2.onmouseout=handler;

      /*
      btn2.onclick = function(){}
      btn2.onmouseover = function(){}
      btn2.onmouseout=function(){}
      */
    }
  </script>
</head>
<body>
<button id="mybtn"><span>눌러봐</span></button>
<br>
<button id="mybtn2">눌러봐2</button>
</body>
</html>
