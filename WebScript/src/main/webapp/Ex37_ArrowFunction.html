 <script>
        //https://www.w3schools.com/js/js_arrow_function.asp 참고 자료

        //화살표 함수 (줄임....)

        //일반함수
        //function foo(){}

        //익명함수
        let foo = function() {  //javascript : 함수(일급객체) (함수를 변수에 할당)
            console.log("foo...");
        }

        //실행방법
        foo();

        //2015 ES6 줄임 표현 (Arrow Function)
        let bar = () => console.log("bar...");
        bar();

        //매개변수 1개  return 
        let foo2 = x => x;   // let foo2 = functon(x) {return x;}
        const data = foo2(100);

        let hello;
        hello = val => "hello"+val; // let hello = function(val) {return "hello" + val}
        const v = hello(" world");
        console.log(v); // hello world

        //매개변수가 2개 이상인 경우부터
        //function call(a,b) or  function call(a,b,c,d)
        //let foo3 = (a,b) => { return a+b;};
        let foo3 = (a,b) => a+b;
        const v2 = foo3(10,20);
        console.log(v2);

        //만약에 함수안에 여러개의 논리가 필요하다면 (if , switch)
        let foo4 = (a,b) => {
            let c = 100;
            return a+b+c;
        }

        //응용
        //함수가 return 하는 자원인 json 객체라면
        let foo5 = () => ({a:1 , b:2 , c:3});        //{{}} (x)
        const obj = foo5();
        console.log(obj); //json 객체

        //즉시 실행 함수 ()
        (
            function(){
                console.log("즉시 실행 함수");
            }
        )();

        /*
            https://www.w3schools.com/JSREF/jsref_foreach.asp
            배열에 관련된 다양한 함수

            forEach(1) , isArray , map(2) , filter , 

        */

        // 26.05.28~
        /*
        초급자 (암기)
        1. for(let i = 0 ; i < 10 ; i++){}
        2. for(let index in Array) { Array[index] }
        3. for(let value of Array) { value}

        객체(JSON)
        JSON {a:1, b:2 , c:3}
        1. for(let key in Object) {Object[key]}   ex) 객체["a"] return 1
        2. const obj = {a:1} >> (객체.속성명) obj.a return 1

        추가적으로
        1.Array.isArray()
        2.Array.forEach(function(value,index,array){})  배열.forEach
        3.Array.map() > 새로운 배열 조작()형태의 배열을 리턴
        4.array.filter(function(currentValue, index, arr), thisValue)  return 배열 
        */

        function myFunc(){
          const data = ["A", "B", "C", "D"];
          let x =document.getElementById("demo2");
          x.innerHTML  = Array.isArray(data);
        }

        //호출
        myFunc();

        let txt = "";
        const numbers = [45,5,8,46,25];
        //Array.forEach(function(value, index, array){...})

        function myFunc2(value, index, array){
          txt = "("+value+")"+"["+index+"]"+"["+array+"]";
          console.log(txt);
        }

        //POINT
        numbers.forEach(myFunc2); //return ...
        /*
           (45)[0][45,5,8,,46,25]
           (5)[1][45,5,8,,46,25]
           (8)[2][45,5,8,,46,25]
           (46)[4][45,5,8,,46,25]
           (25)[5][45,5,8,,46,25]
        */

        const numbers2 = [65,88,5,13];
        const newArr = numbers2.map(function(value, index, array){
          return value*10+index; //가공된 값을 배열로 (새로운 배열)
        });
        console.log(newArr);
        //[650,881,52,133]


        //응용하기
        let evens = [2,4,6,8];
        /*
        let odds = evens.map(function(value){
            return value + 1;
        });
        */
        //화살표 함수 (callback 함수 구현 : 화살표 함수 사용 )
        let odds = evens.map(value => value + 1);
        console.log(odds);

                    return value+index;
