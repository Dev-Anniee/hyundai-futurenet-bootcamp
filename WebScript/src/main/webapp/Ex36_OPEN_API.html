    console.log(data);
    console.log(data.items);
    console.log(data.items[0].media.m);

    window.onload = function() {
      let myPhotos = [];
      let itemList = data.items;
      for (let i = 0; i < itemList.length; i++) {
        myPhotos.push(itemList[i].media.m); //media 체
      }
      document.getElementById("imgs").src = myPhotos[0];

      let index = 0;
      //global 모든 함수에서 사용가능

      /*
click 이벤트 2개  (addEventListener , callback함수(익명함수))
<a href="#" id="prv">이전</a>
<a href="#" id="next">다음</a>

이미지를 보여주는 슬라이드(DOM)
*/
      document.getElementById("prv").addEventListener("click", function() {
        //익명함수
        if (index == 0) {
          index = myPhotos.length;
        }
        document.getElementById("imgs").src = myPhotos[--index];
      });

      //next click
      document.getElementById("next").addEventListener("click", function() {
        //익명함수
        if (++index == myPhotos.length) {
          //[0][1][2][3]
          index = 0;
        }
        document.getElementById("imgs").src = myPhotos[index];
      });
    }
  </script>

||<a href="#" id="next">다음</a>
